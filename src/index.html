<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.png" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#8b4513" />

    <title>Tikum</title>
  </head>
  <body>
    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to Content</a>

    <header role="banner">
      <div class="main-header container">
        <a class="brand-name" href="#/"><i class="fas fa-book"></i> Tikum</a>

        <nav id="navigation-drawer" class="navigation-drawer" role="navigation" aria-label="Main Navigation">
          <div class="main-nav-container">
            <ul id="nav-list" class="nav-list">
              <li class="nav-center-item">
                <a href="#/"><i class="fas fa-home"></i> Stories</a>
              </li>
              <li class="nav-center-item">
                <a href="#/add" id="add-story-nav"><i class="fas fa-plus"></i> Add Story</a>
              </li>
              <li class="nav-center-item">
                <a href="#/saved-stories"><i class="fas fa-bookmark"></i> Saved Stories</a>
              </li>
            </ul>
          </div>

          <div class="user-nav-container">
            <div id="auth-buttons">
              <a href="#/login" class="auth-button login-button"><i class="fas fa-sign-in-alt"></i> Login</a>
              <a href="#/register" class="auth-button register-button"><i class="fas fa-user-plus"></i> Register</a>
            </div>
            <div id="user-info" style="display: none">
              <span id="user-name"></span>
              <button id="subscribe-notification-btn" class="auth-button" style="margin-left: 8px; display: none"><i class="fas fa-bell"></i></button>
              <button id="logout-button" class="auth-button logout-button"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
          </div>
        </nav>

        <button id="drawer-button" class="drawer-button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navigation-drawer"><i class="fas fa-bars"></i></button>
      </div>
    </header>

    <main id="main-content" class="main-content" role="main" tabindex="-1"></main>

    <footer role="contentinfo" class="site-footer">
      <div class="container">
        <p>&copy; 2025 Tikum. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
